# fly.toml — conselho-voice-embed (serviço interno de embeddings de voz)
#
# min_machines_running=0: fica desligado quando ninguém usa (biometria é
# opt-in por empresa) — aceita cold-start de alguns segundos no 1º uso.

app = "conselho-voice-embed"
primary_region = "gru"

[build]

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    timeout = "10s"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
